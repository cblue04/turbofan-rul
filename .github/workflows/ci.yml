name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: cmapss-v1
      - run: python scripts/download_data.py
      - name: Train
        run: python -m rul.train
        env:
          PYTHONPATH: src
          MLFLOW_DISABLE_AGENT_HINT: "1"
      - name: Quality gate (fail if test RMSE regresses)
        run: |
          python -c "import json,sys; r=json.load(open('reports/results.json'))['lgbm_full']; print('test_rmse', r['test_rmse']); sys.exit(r['test_rmse'] > 13.0)"
      - run: pytest -q
      - name: Build serving image
        run: docker build -t turbofan-rul .
